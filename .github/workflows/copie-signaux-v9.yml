name: "CopyTrading 50 V9 - Signaux spot et LONG PAPER"
on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Minutes : 5 a 330, par pas de 5"
        required: true
        default: "240"
        type: string
permissions:
  contents: write
concurrency:
  group: copytrading50-v7
  cancel-in-progress: false
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Validate duration and load installed V7 and V8 sources
        env:
          DURATION: ${{ inputs.duration_minutes }}
        run: |
          python3 - <<'PY_BASE'
          import base64, io, os, re, zipfile
          from pathlib import Path
          v=os.environ['DURATION']
          if not v.isdecimal() or not 5<=int(v)<=330 or int(v)%5:
              raise SystemExit('Invalid duration')
          v7=Path('.github/workflows/copy-mirror-v7.yml')
          v8=Path('.github/workflows/copie-dynamique-v8.yml')
          if not v7.exists() or not v8.exists():
              raise SystemExit('Both V7 and V8 workflow sources required')
          for p, pattern in ((v7,r"bundle='''\s*(.*?)\s*'''"),
                             (v8,r'bundle\s*=\s*"""(.*?)"""')):
              m=re.search(pattern,p.read_text(encoding='utf-8'),re.S)
              if not m: raise SystemExit('Source bundle not found: '+p.name)
              blob=base64.b64decode(''.join(m.group(1).split()),validate=True)
              with zipfile.ZipFile(io.BytesIO(blob)) as z:
                  if z.testzip() is not None: raise SystemExit('Corrupted source ZIP')
                  for it in z.infolist():
                      q=Path(it.filename)
                      if q.is_absolute() or '..' in q.parts: raise SystemExit('Unsafe ZIP path')
                  z.extractall('.')
          PY_BASE
          python3 -m pip install websocket-client==1.8.0
