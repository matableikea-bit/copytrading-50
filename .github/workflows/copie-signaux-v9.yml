      - name: Copy observed public spot and LONG signals with paper money only
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DURATION: ${{ inputs.duration_minutes }}
        run: |
          python3 - <<'PY_RUN'
          import os
          import run_live
          from select_v9 import choose_handles
          from mirror_v9 import PaperMirrorV9
          run_live.choose_handles=choose_handles
          run_live.PaperMirror=PaperMirrorV9
          run_live.main(['--minutes',os.environ['DURATION'],'--publish'])
          PY_RUN
      - name: Upload paper-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CopyTrading50-V9-report-${{ github.run_id }}
          path: docs/data.json
          if-no-files-found: warn
