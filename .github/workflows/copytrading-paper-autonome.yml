name: "CopyTrading 50 V14.4 AUTONOME — 2min / 10h / 12h"

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Durée de simulation (PAPER : aucun vrai ordre)"
        required: true
        default: "2min"
        type: choice
        options:
          - "2min"
          - "10h"
          - "12h"

permissions:
  contents: read

concurrency:
  group: copytrading50-paper-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

