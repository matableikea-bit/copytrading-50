      - name: "Tests du projet"
        run: |
          python -m unittest discover -s tests -q
          python -m compileall -q bot
          python -c 'from bot.settings import Config; cfg=Config.load("config.json"); assert cfg.mode == "PAPER", "LIVE forbidden on GitHub"'
      - name: "Partager le code auditable avec les étapes"
        uses: actions/upload-artifact@v4
        with:
          name: bot-source-v14-4
          path: |
            bot/
            config.json
            docs/index.html
          retention-days: 7
          if-no-files-found: error

  segment_1:
    name: "Étape 1 / 3 — Scanner, analyser, simuler"
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 265
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      SIM_WALLETS_JSON: ${{ vars.SIM_WALLETS_JSON }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Récupérer le code du bot"
        uses: actions/download-artifact@v4
        with:
          name: bot-source-v14-4
          path: .
      - name: "Démarrer une nouvelle simulation PAPER"
        run: python -m bot.gh_session --session "${{ inputs.session }}" --stage 1
      - name: "Générer le tableau de bord hors ligne"
        if: always()
        run: python -m bot.snapshot
      - name: "Sauvegarder le portefeuille et les rapports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-stage-1
          path: |
            runtime/github-session.sqlite
            docs/status.json
            docs/performance.json
            docs/trades.csv
            docs/resultats.html
          retention-days: 7
          if-no-files-found: warn

  segment_2:
    name: "Étape 2 / 3 — Reprendre le même portefeuille"
    if: ${{ inputs.session != '2min' }}
    needs: segment_1
    runs-on: ubuntu-latest
    timeout-minutes: 265
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      SIM_WALLETS_JSON: ${{ vars.SIM_WALLETS_JSON }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Récupérer le code du bot"
        uses: actions/download-artifact@v4
        with:
          name: bot-source-v14-4
          path: .
      - name: "Récupérer la sauvegarde de l'étape précédente"
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-stage-1
          path: .
      - name: "Reprendre la simulation PAPER"
        run: python -m bot.gh_session --session "${{ inputs.session }}" --stage 2
      - name: "Générer le tableau de bord hors ligne"
        if: always()
        run: python -m bot.snapshot
      - name: "Sauvegarder le portefeuille et les rapports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-stage-2
          path: |
            runtime/github-session.sqlite
            docs/status.json
            docs/performance.json
            docs/trades.csv
            docs/resultats.html
          retention-days: 7
          if-no-files-found: warn

  segment_3:
    name: "Étape 3 / 3 — Finaliser et calculer les résultats"
    if: ${{ inputs.session != '2min' }}
    needs: segment_2
    runs-on: ubuntu-latest
    timeout-minutes: 265
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      SIM_WALLETS_JSON: ${{ vars.SIM_WALLETS_JSON }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Récupérer le code du bot"
        uses: actions/download-artifact@v4
        with:
          name: bot-source-v14-4
          path: .
      - name: "Récupérer la sauvegarde de l'étape précédente"
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-stage-2
          path: .
      - name: "Clôturer la simulation PAPER"
        run: python -m bot.gh_session --session "${{ inputs.session }}" --stage 3
      - name: "Générer le tableau de bord final hors ligne"
        if: always()
        run: python -m bot.snapshot
      - name: "Exporter la base SQLite et les performances"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-stage-3-final
          path: |
            runtime/github-session.sqlite
            docs/status.json
            docs/performance.json
            docs/trades.csv
            docs/resultats.html
          retention-days: 14
          if-no-files-found: warn
