      - name: Mirror real published trade signals into fictional portfolios
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
          DURATION: ${{ inputs.duration_minutes }}
        run: python run_live.py --minutes "$DURATION" --publish
      - name: Save paper report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CopyTrading50-V7-report-${{ github.run_id }}
          path: docs/data.json
          if-no-files-found: warn
