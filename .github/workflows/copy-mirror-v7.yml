on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Durée (5 à 330 minutes, multiple de 5)"
        required: true
        type: string
        default: "240"
permissions:
  contents: write
concurrency:
  group: copytrading50-v7
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 345
