      - name: Run only PAPER signal copier; persist ledger to repository
        if: steps.gate.outputs.run == 'true'
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
          V12_MODE: ${{ github.event_name == 'schedule' && 'resume' || inputs.operation }}
          V12_HOURS: ${{ inputs.horizon_hours || '10' }}
        run: python3 v12_engine.py --mode "$V12_MODE" --hours "$V12_HOURS" --slice-minutes 26 --publish
      - name: Upload last checkpoint even if simulated run fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CopyTrading50-V12-${{ github.run_id }}
          path: |
            docs/v12-data.json
            docs/v12-state.json
          if-no-files-found: warn
