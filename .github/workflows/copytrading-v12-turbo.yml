name: "CopyTrading 50 V12 - TURBO 10h-24h PAPER"
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Start or stop a PAPER simulation"
        required: true
        type: choice
        options: [start, stop]
        default: start
      horizon_hours:
        description: "Total simulation horizon (hours)"
        required: true
        type: choice
        options: ['10', '24']
        default: '10'
  schedule:
    # Continue checkpoints every 30 minutes (UTC). Best effort, not real-time.
    - cron: '12,42 * * * *'
permissions:
  contents: write
concurrency:
  group: copytrading50-v7
  cancel-in-progress: false
jobs:
  turbo_paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Skip idle scheduled runs safely
        id: gate
        env:
          V12_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY_GATE'
          import os,json
          from pathlib import Path
          run=True
          if os.environ.get('V12_EVENT')=='schedule':
              f=Path('docs/v12-state.json')
              try:
                  s=json.loads(f.read_text()) if f.exists() else {}
                  run=s.get('version')==12 and s.get('status')=='ACTIVE'
              except (OSError,ValueError):run=False
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('run='+str(run).lower()+'\n')
          print('V12 engine required:',run)
          PY_GATE
      - name: Verify and extract self-contained V12 source and regression tests
