      - name: Observe public trades and mirror with 50 EUR fictifs
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
          DURATION: ${{ inputs.duration_minutes }}
        run: python3 v10_engine.py --minutes "$DURATION" --publish
      - name: Upload last V10 report even if session fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CopyTrading50-V10-${{ github.run_id }}
          path: docs/v10-data.json
          if-no-files-found: warn
