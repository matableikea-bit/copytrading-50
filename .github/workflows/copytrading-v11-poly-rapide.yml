          """
          data=base64.b64decode(''.join(bundle.split()),validate=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              if z.testzip() is not None:
                  raise SystemExit('Source V11 archive failed integrity check')
              for item in z.infolist():
                  p=Path(item.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Unsafe bundled path refused')
              z.extractall('.')
