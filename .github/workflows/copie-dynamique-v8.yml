name: "CopyTrading 50 V8 - Selection + miroir PAPER"
on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duree de session en minutes (5 a 330, pas de 5)"
        required: true
        default: "240"
        type: string
permissions:
  contents: write
concurrency:
  group: copytrading50-v7
  cancel-in-progress: false
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Verifier la duree
        env:
          DURATION: ${{ inputs.duration_minutes }}
        run: |
          python3 - <<'PY_CHECK'
          import os
          v=os.environ['DURATION']
          if not v.isdecimal() or not 5 <= int(v) <= 330 or int(v) % 5:
              raise SystemExit('Duree invalide (5..330, multiple de 5)')
          PY_CHECK
      - name: Recuperer le code PAPER V7 deja installe
        run: |
          python3 - <<'PY_V7'
          import base64,io,re,zipfile
          from pathlib import Path
          p=Path('.github/workflows/copy-mirror-v7.yml')
          if not p.exists():
              raise SystemExit('Installer d abord la V7 (fichier GitHub manquant)')
          original=p.read_text(encoding='utf-8')
          m=re.search("bundle="+chr(39)*3+r"\s*(.*?)\s*"+chr(39)*3,original,re.S)
          if not m:
              raise SystemExit('Archive V7 integree absente ou invalide')
          raw=base64.b64decode(''.join(m.group(1).split()),validate=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              if z.testzip() is not None: raise SystemExit('Archive V7 corrompue')
              for f in z.infolist():
                  name=Path(f.filename)
                  if name.is_absolute() or '..' in name.parts: raise SystemExit('Chemin ZIP refuse')
              z.extractall('.')
          PY_V7
          python3 -m pip install websocket-client==1.8.0
