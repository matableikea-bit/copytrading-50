        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DURATION: ${{ inputs.duration_minutes }}
        run: |
          python3 - <<'PY_RUN'
          import os
          import run_live
          from discovery_v8 import choose_handles
          from mirror_v8 import PaperMirrorV8
          run_live.choose_handles = choose_handles
          run_live.PaperMirror = PaperMirrorV8
          run_live.main(['--minutes',os.environ['DURATION'],'--publish'])
          PY_RUN
      - name: Enregistrer le rapport final meme en cas d erreur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copytrading-v8-rapport-${{ github.run_id }}
          path: docs/data.json
          if-no-files-found: warn
