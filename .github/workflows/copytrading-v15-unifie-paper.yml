          +"""One GitHub PAPER portfolio, one SQLite checkpoint, with embedded Sniper."""
          +from __future__ import annotations
          +import argparse
          +import os
          +import sys
          +
          +from .gh_session import SESSION_SECONDS, run_stage, prepare_config, write_performance, append_summary
          +from .sniper_agent import IntegratedBot
          +
          +
          +def main(argv=None):
          +    p=argparse.ArgumentParser()
          +    p.add_argument('--session',choices=SESSION_SECONDS,required=True)
          +    p.add_argument('--stage',type=int,required=True)
          +    p.add_argument('--config',default='config.json')
          +    p.add_argument('--db',default='runtime/github-session.sqlite')
          +    p.add_argument('--report',default='docs/status.json')
          +    p.add_argument('--performance',default='docs/performance.json')
          +    p.add_argument('--trades',default='docs/trades.csv')
          +    args=p.parse_args(argv)
          +    cfg=prepare_config(args.config,os.getenv('SIM_WALLETS_JSON'))
          +    cfg.session_hours=1 if args.session=='2min' else int(args.session[:-1])
          +    cfg.validate()
          +    try:
          +        report=run_stage(cfg,session=args.session,stage=args.stage,db_path=args.db,
          +                         report_path=args.report,run_id=os.getenv('GITHUB_RUN_ID','local'),
          +                         bot_factory=IntegratedBot)
          +        write_performance(args.db,args.performance,args.trades)
          +        append_summary(report,args.stage,args.session)
          +        print('UNIFIED PAPER checkpoint saved',flush=True)
          +    except Exception as exc:
          +        # The remote may echo secrets in error messages: log exception type only.
          +        print('UNIFIED PAPER FAIL CLOSED: '+type(exc).__name__,file=sys.stderr,flush=True)
          +        raise SystemExit(2)
          +
          +if __name__=='__main__':main()
