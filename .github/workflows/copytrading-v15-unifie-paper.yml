          +"""Embedded high-frequency PAPER Sniper for the V14.7 portfolio.
          +
          +Shares ONE Bot.state, SQLite and cash balance with SCOUT, COPIER and RISK.
          +Never places live orders. The entry/exit prices are indicative Jupiter quotes,
          +not fills. Pump.fun bonding-curve tokens may not be quotable on Jupiter.
          +"""
          +from __future__ import annotations
          +import json
          +import os
          +from pathlib import Path
          +from threading import Event, RLock, Thread
          +import time
          +from urllib.parse import urlencode
          +from decimal import Decimal, ROUND_DOWN
          +
          +from .settings import D
          +from .risk import risk_budget
          +from .runner import Bot, stamp
          +from .providers import USDC
          +from .sniper_transport import (Remote, ProviderFailure, PUMPFUN,
          +                               create_event_signature, is_pubkey, is_signature)
          +
          +
          +class SniperAgent:
          +    def __init__(self, bot: Bot, lock: RLock, *, remote=None, mono=time.monotonic,
          +                 wall=time.time, socket_factory=None):
          +        if bot.cfg.mode != 'PAPER':
          +            raise ValueError('Sniper is PAPER only')
          +        self.bot, self.lock = bot, lock
          +        self.mono, self.wall = mono, wall
          +        self.remote = remote or Remote(os.getenv('HELIUS_API_KEY',''),
          +                                      os.getenv('JUPITER_API_KEY',''))
          +        self.socket_factory=socket_factory
          +        self.stop=Event()
          +        self.thread=None
          +        self.stats=bot.store.get('sniper_stats',{
          +            'enabled':True, 'hold_seconds_target':15, 'age_min_seconds':0,
          +            'reaction_target_seconds':1, 'guaranteed_latency':False,
          +            'events':0, 'buys':0, 'sells':0, 'rejects':0, 'exit_retries':0,
          +            'last_issue':'', 'price_type':'indicative_quotes_not_real_fills'})
          +        self.stats['enabled']=True
          +        self.stats['age_min_seconds']=0
          +        self.stats['shared_portfolio']=True
          +        with self.lock:self.bot.store.put('sniper_stats',self.stats)
          +
          +    def record(self, decision, reason, *, mint='', signature='', delay=None):
          +        """Always called while holding the shared state lock."""
          +        if decision=='BUY':self.stats['buys']+=1
          +        elif decision=='SELL':self.stats['sells']+=1
          +        elif decision=='REJECT':self.stats['rejects']+=1
          +        elif decision=='RETRY':self.stats['exit_retries']+=1
          +        self.stats['last_issue']=reason if decision in ('REJECT','RETRY','ERROR') else ''
          +        if delay is not None:self.stats['last_observed_latency_seconds']=round(delay,3)
          +        self.stats['last_event']=reason
          +        self.stats['last_updated_utc']=stamp(int(self.wall()))
          +        self.bot.store.put('sniper_stats',self.stats)
          +        eid=f'sniper:{decision}:{mint}:{signature}:{int(self.wall()*10)}:{self.stats["events"]}'
          +        self.bot.log('SNIPER',decision,reason,{'mint':mint,'signature':signature,
          +                    'elapsed_seconds':delay},event_id=eid)
          +
          +    def candidate(self, mint, signature, received_at):
          +        """Launch has been validated by Pump.fun logs + a confirmed transaction."""
          +        if not is_pubkey(mint) or not is_signature(signature):return False
          +        with self.lock:
          +            self.stats['events']+=1
          +            eid=f'sniper:launch:{mint}'
          +            if self.bot.store.seen(eid):return False
          +            # Persist dedup before potentially slow provider calls.
          +            self.bot.log('SNIPER','OBSERVED','launch',{'mint':mint},event_id=eid)
          +            if self.bot.state['halted'] or int(self.wall())>=self.bot.state['expires_at']:
          +                self.record('REJECT','halted_or_expired',mint=mint);return False
          +            if Path('STOP_TRADING').exists() or Path('PAUSE_BUYS').exists():
          +                self.record('REJECT','operator_paused',mint=mint);return False
          +            if mint in self.bot.state['positions']:
          +                self.record('REJECT','already_owned',mint=mint);return False
          +            amount,reason=risk_budget(self.bot.state,self.bot.cfg,self.bot.marks,self.bot.exit_values)
          +            amount=min(amount,D(self.bot.cfg.starting_usdc)*D('0.10'))
          +            amount=min(amount,D(self.bot.state['cash_usdc'])-D(self.bot.cfg.paper_network_cost_usdc))
          +            if amount<D(self.bot.cfg.min_trade_usdc):
          +                self.record('REJECT',reason if reason!='pass' else 'risk_budget_insufficient',mint=mint)
          +                return False
          +        if self.mono()-received_at>5:
          +            with self.lock:self.record('REJECT','stale_launch',mint=mint,
          +                                       delay=self.mono()-received_at)
          +            return False
          +        try:
          +            decimals=self.remote.mint_safe(mint)
          +            if type(decimals) is not int:
          +                raise ProviderFailure('invalid_verified_token_decimals')
          +            raw_usdc=int((amount*D(1000000)).to_integral_value(rounding=ROUND_DOWN))
          +            raw_qty=int(self.remote.quote(USDC,mint,raw_usdc)*
          +                        (1-D(self.bot.cfg.paper_extra_slippage_fraction)))
          +            if raw_qty<=0:raise ProviderFailure('no_token_after_slippage')
          +            reverse=int(self.remote.quote(mint,USDC,raw_qty))
          +            net=(D(reverse)/D(1000000)*(1-D(self.bot.cfg.paper_extra_slippage_fraction))-
          +                 D(self.bot.cfg.paper_network_cost_usdc))
          +            if net<=0 or net<amount*(1-D(self.bot.cfg.max_all_in_round_trip_loss_fraction)):
          +                raise ProviderFailure('roundtrip_loss_exceeds_limit')
          +        except (ProviderFailure,ValueError,ArithmeticError) as exc:
          +            with self.lock:self.record('REJECT',str(exc)[:100],mint=mint,
          +                                       delay=self.mono()-received_at)
          +            return False
          +        latency=self.mono()-received_at
          +        if latency>8:
          +            with self.lock:self.record('REJECT','quote_late_over_8s',mint=mint,delay=latency)
          +            return False
          +        with self.lock:
          +            # Reassess against the SAME shared portfolio after slow network calls.
          +            allowed,reason=risk_budget(self.bot.state,self.bot.cfg,self.bot.marks,self.bot.exit_values)
          +            cost=amount+D(self.bot.cfg.paper_network_cost_usdc)
          +            if (allowed<amount or mint in self.bot.state['positions'] or
          +                self.bot.state['halted'] or int(self.wall())>=self.bot.state['expires_at'] or
          +                D(self.bot.state['cash_usdc'])<cost):
          +                self.record('REJECT','shared_risk_changed',mint=mint,delay=latency)
          +                return False
          +            if latency>8:
          +                self.record('REJECT','late_after_lock',mint=mint,delay=latency)
          +                return False
          +            opened_at=int(self.wall())
          +            qty=D(raw_qty)/(D(10)**decimals)
          +            if qty<=0:
          +                self.record('REJECT','invalid_token_quantity',mint=mint);return False
          +            self.bot.state['cash_usdc']=str(D(self.bot.state['cash_usdc'])-cost)
          +            self.bot.exit_values[mint]=net
          +            self.bot.state['positions'][mint]={
          +                'symbol':'SNIPER','qty':str(qty),'raw_qty':str(raw_qty),
          +                'decimals':decimals,'cost_usdc':str(cost),
          +                'entry_price_usd':str(amount/qty),'peak_price_usd':str(amount/qty),
          +                'peak_exit_value_usdc':str(net),'partial_take_profit_done':False,
          +                'opened_at':opened_at,'source':'SNIPER','source_wallet':None,
          +                'event_id':eid,'sniper_exit_due_wall':self.wall()+15,
          +                'sniper_entry_signature':signature}
          +            trade={'time':stamp(opened_at),'side':'BUY','mint':mint,'symbol':'SNIPER',
          +                   'source':'SNIPER','source_wallet':None,'position_id':f'{mint}:{opened_at}',
          +                   'spent_usdc':str(amount),'qty':str(qty),
          +                   'paper_network_cost_usdc':str(self.bot.cfg.paper_network_cost_usdc),
          +                   'mode':'PAPER','chain_tx_signature':None,
          +                   'measured_entry_latency_seconds':round(latency,3),
          +                   'execution':'indicative_jupiter_quote_no_fill'}
          +            self.bot.state['trades'].append(trade)
          +            self.record('BUY','shared_paper_buy',mint=mint,signature=signature,delay=latency)
          +            return True
          +
          +    def exit_due(self):
          +        """Sells sniper positions at 15s (or retries); preserves failed open exits."""
          +        with self.lock:
          +            now=self.wall()
          +            for mint,p in list(self.bot.state['positions'].items()):
          +                if p.get('source')!='SNIPER':continue
          +                due=p.get('sniper_exit_due_wall')
          +                if due is None:due=now  # resume after restart, never defer stale exits
          +                if now<float(due):continue
          +                elapsed=max(0,now-float(due)+15)
          +                done=self.bot._sell(mint,'sniper_exit_15s',
          +                                    event_id=f'sniper:exit:{mint}:{p["opened_at"]}')
          +                if done:
          +                    self.record('SELL','sniper_exit_15s',mint=mint,delay=elapsed)
          +                else:
          +                    p['sniper_exit_due_wall']=self.wall()+1
          +                    self.bot.store.put('portfolio',self.bot.state)
          +                    self.record('RETRY','exit_quote_unavailable',mint=mint,delay=elapsed)
          +
          +    def consume_message(self,msg):
          +        """WebSocket launches only; never takes trading instructions from the feed."""
          +        try:payload=json.loads(msg)
          +        except (ValueError,TypeError):return
          +        if not isinstance(payload,dict):return
          +        if payload.get('error'):
          +            with self.lock:self.record('ERROR','helius_subscription_rejected')
          +            return
          +        signature=create_event_signature(payload)
          +        if not signature:return
          +        arrival=self.mono()
          +        try:mint=self.remote.confirmed_new_mint(signature)
          +        except ProviderFailure as exc:
          +            with self.lock:self.record('REJECT',str(exc)[:100],signature=signature)
          +            return
          +        if mint:self.candidate(mint,signature,arrival)
          +
          +    def start(self):
          +        self.thread=Thread(target=self._stream,daemon=True,name='embedded-sniper-websocket')
          +        self.thread.start()
          +
          +    def shutdown(self):
          +        self.stop.set()
          +        if self.thread:self.thread.join(timeout=12)
          +        if self.thread and self.thread.is_alive():
          +            raise RuntimeError('sniper_worker_still_running_at_checkpoint')
          +
          +    def _stream(self):
          +        if not self.remote.helius_key or not self.remote.jupiter_key:
          +            with self.lock:self.record('ERROR','helius_or_jupiter_secret_missing')
          +            return
          +        factory=self.socket_factory
          +        if factory is None:
          +            from websocket import create_connection
          +            factory=create_connection
          +        pause=.5
          +        while not self.stop.is_set() and int(self.wall())<self.bot.state['expires_at']:
          +            sock=None
          +            try:
          +                sock=factory('wss://mainnet.helius-rpc.com/?'+urlencode({'api-key':self.remote.helius_key}),timeout=2)
          +                sock.settimeout(.25)
          +                sock.send(json.dumps({'jsonrpc':'2.0','id':1,'method':'logsSubscribe',
          +                                      'params':[{'mentions':[PUMPFUN]}, {'commitment':'confirmed'}]}))
          +                pause=.5
          +                while not self.stop.is_set():
          +                    self.exit_due()
          +                    if int(self.wall())>=self.bot.state['expires_at']:
          +                        break
          +                    try:msg=sock.recv()
          +                    except TimeoutError:continue
          +                    except Exception as exc:
          +                        if type(exc).__name__ in ('WebSocketTimeoutException','WebSocketConnectionClosedException'):
          +                            if type(exc).__name__=='WebSocketTimeoutException':continue
          +                        raise
          +                    self.consume_message(msg)
          +            except Exception as exc:
          +                # The Helius URL embeds the API key: never expose exception text.
          +                with self.lock:self.record('ERROR','stream_'+type(exc).__name__)
          +            finally:
          +                if sock:
          +                    try:sock.close()
          +                    except Exception:pass
          +            if not self.stop.is_set():self.stop.wait(pause)
          +            pause=min(8,pause*2)
          +        # After session expiry, try to complete scheduled PAPER exits briefly.
          +        grace=self.mono()+30
          +        while not self.stop.is_set() and self.mono()<grace:
          +            with self.lock:remaining=any(p.get('source')=='SNIPER' for p in self.bot.state['positions'].values())
          +            if not remaining:break
          +            self.exit_due()
          +            self.stop.wait(.25)
          +
          +
          +class IntegratedBot(Bot):
          +    """The original V14.7.3 bot with one embedded event-driven Sniper agent."""
          +    def __init__(self,*args, start_sniper=True, sniper_remote=None, sniper_clock=None, **kwargs):
          +        super().__init__(*args,**kwargs)
