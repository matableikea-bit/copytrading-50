name: "CopyTrading V15 — SNIPER INTÉGRÉ + V14.7.3 PAPER"

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Durée de la simulation PAPER"
        required: true
        type: choice
        default: "2min"
        options: ["2min", "10h", "12h"]
      capital:
        description: "Capital fictif USDC"
        required: true
        type: choice
        default: "100"
        options: ["50", "100"]
      profil:
        description: "Offensif augmente les risques sans garantir de gain"
        required: true
        type: choice
        default: "offensif"
        options: ["standard", "offensif"]

permissions:
  contents: read
concurrency:
  group: copytrading-v15unified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: "Reconstruction des sources + 174 tests + diagnostic API"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Reconstituer les 41 fichiers lisibles de V14.7"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path('.github/workflows/copytrading-v147-complet.yml')
          if not source.is_file(): raise RuntimeError('La V14.7 complète doit rester installée')
          lines=source.read_text(encoding='utf-8').splitlines()
          regex=re.compile(r"^ {10}cat > '([^']+)' <<'(__COPYTRADING_147_SOURCE_\d+__)'$")
          i=0;count=0
          while i<len(lines):
              match=regex.match(lines[i])
              if not match:i+=1;continue
              name,end=match.groups();j=i+1
              while j<len(lines) and lines[j]!=' '*10+end:j+=1
              if j==len(lines):raise RuntimeError('Source V14.7 tronquée: '+name)
              path=Path(name)
              if path.is_absolute() or '..' in path.parts:raise RuntimeError('Chemin source interdit')
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text('\n'.join(line[10:] for line in lines[i+1:j])+'\n',encoding='utf-8')
              count+=1;i=j+1
          assert count==41, f'Sources incomplètes: {count} au lieu de 41'
          PY
      - name: "Appliquer les correctifs V14.7.3, tous visibles"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/copytrading-v1473.patch <<'__COPYTRADING_1473_PATCH__'
          --- /dev/null
          +++ b/README_V14.7.2.txt
          @@ -0,0 +1,21 @@
          +CopyTrading V14.7.2 — diagnostic et correction des API (PAPER ONLY)
          +
          +Corrigé par rapport au workflow V14.7.1 :
          +- Les vérifications on-chain utilisent maintenant le RPC Helius associé à HELIUS_API_KEY lorsque SOLANA_RPC_URL et HELIUS_RPC_URL ne sont pas définies.
          +- Les échecs HTTP affichent le service, le chemin sans paramètres secrets et le code HTTP exact.
          +- Les réponses Jupiter V2 de type « cotation seule » sont acceptées sans requestId ; les ordres avec wallet exigent toujours requestId et transaction.
          +- Le workflow vérifie les cotations Jupiter SOL/USDC et l'accès RPC Helius AVANT de lancer un test long ; aucune transaction réelle.
          +- Les contrôles de sécurité Token-2022, prix aller-retour, wallet et frais restent en place.
          +- Le bot fonctionne uniquement en PAPER sur GitHub.
          +
          +Validation effectuée : 159 tests locaux par reconstitution depuis le YAML V14.7 de GitHub. Une copie séparée V14.7.1 améliorée a aussi passé 166 tests. Pas d'accès aux clés GitHub dans cet environnement : les réponses Helius/Jupiter réelles et les profits ne sont PAS vérifiés.
          +
          +Installation dans copytrading-50 :
          +1. Ajouter un NOUVEAU fichier dans .github/workflows/copytrading-v1472-api-fix.yml.
          +2. Coller intégralement CopyTrading-50-V14.7.2-API-FIX-A-COPIER.yml, puis enregistrer.
          +3. GitHub Actions > CopyTrading V14.7.2 — API FIX PAPER > Run workflow.
          +4. Choisir session=2min, capital=50, profil=standard.
          +5. Si « Diagnostic Helius + Jupiter » rouge, consulter son journal : il indique le service et le statut HTTP, sans exposer les clés.
          +6. Si tout est vert, consulter checkpoint-v1472-stage-1 (simulation). La couleur verte valide le programme, PAS une rentabilité.
          +
          +Ne pas remplacer V14.7.1 avant d'avoir obtenu le diagnostic. Le code est lisible, sans base64 ni programme compressé.
          --- /dev/null
          +++ b/README_V14.7.3.md
          @@ -0,0 +1,28 @@
          +# CopyTrading 50 V14.7.3 — audit de fonctionnement PAPER
          +
          +**PAPER uniquement.** Aucune clé privée requise, aucun ordre réel envoyé depuis GitHub. Le but est de vérifier le fonctionnement, pas de promettre un rendement.
          +
          +## Corrections contrôlées
          +
          +- Helius : fallback RPC en cas de 404 de l’ancien endpoint ; recherche du curseur par pages de 1 000 signatures maximum, y compris lorsque le fournisseur renvoie une page partielle et décodage de 64 signatures au plus par cycle ; aucune avance de curseur lors d’une erreur. Le mode de transport (RPC/Enhanced) est désormais enregistré **pour chaque wallet**, puis restauré après chaque redémarrage GitHub ; les anciens checkpoints sans information de transport sont repris en RPC pour éviter les mélanges.
          +- Wallets trop actifs : après trois pertes de curseur rapprochées, la source est marquée indisponible pendant 30 minutes, sans interrompre les autres sources. Une transaction manquée n’est jamais présentée comme copiée.
          +- Comptes token : vérification RPC sur Helius avec la clé existante ; contrôle des autorités et extensions Token-2022 ; refus des actifs et des routes invérifiables.
          +- Jupiter : cotations `GET /swap/v2/order` aller-retour sans `requestId` en mode PAPER ; contrôle des montants et vérification des frais ; espacement des appels HTTP (environ 1,1 s avec une clé, 2,1 s sans clé) pour respecter les limitations courantes.
          +- Diagnostics : API, méthode et code HTTP sans exposer les clés ; résultat de chaque wallet et avertissements de perte d’historique dans les rapports.
          +- 174 tests locaux dont quatre pour garantir la conservation du transport RPC/Enhanced à travers les étapes GitHub. Tests de bout en bout avec fixtures SYNTHÉTIQUES : SCANNER → BRAIN/RISK → achat PAPER → vente PAPER → persistance SQLite ; plus tests de pagination et de sécurité.
          +
          +## Limites non résolues par des tests locaux
          +
          +- Le nombre et la durée des transactions réelles dépendent des API Helius/Jupiter et des permissions de leurs clés. Il faut une exécution GitHub pour valider les réponses de ces fournisseurs.
          +- Les wallets extrêmement actifs dépassent parfois la capacité d’un poll toutes les 60 s ; le bot les met en pause plutôt que de masquer les pertes d’événements. Un service à flux continu (WebSocket/indexeur) serait nécessaire pour du copy trading à la seconde.
          +- Les cotations Jupiter ne garantissent pas un prix exécuté. Les ventes peuvent rester impossibles et la totalité du capital peut être perdue en réel.
          +- Les adresses suivies n’ont pas été auditées en tant que traders rentables.
          +
          +## Vérification locale
          +
          +```bash
          +python -m unittest discover -s tests -q
          +python -m compileall -q bot
          +```
          +
          +Consulter les `checkpoint-v15-unified-stage-1/2/3` produits par GitHub Actions. Les contrôles API du workflow sont en lecture seule et ne passent aucun ordre.
