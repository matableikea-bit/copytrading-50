          +"""Solana Pump.fun READ-ONLY transport; embedded in V14.7.3 PAPER engine.
          +
          +Targets a 1-second event reaction; this is not a guaranteed fill/latency.
          +Not a live-trading program. Market prices are executable-like Jupiter indicative
          +quotes with NO taker, not confirmed on-chain execution or a profitability claim.
          +"""
          +from __future__ import annotations
          +
          +import argparse
          +import csv
          +from html import escape
          +import json
          +import os
          +import re
          +import sys
          +import time
          +from collections import deque
          +from dataclasses import dataclass
          +from decimal import Decimal, ROUND_DOWN
          +from pathlib import Path
          +from urllib.error import HTTPError, URLError
          +from urllib.parse import urlencode
          +from urllib.request import Request, urlopen
          +
          +USDC = 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'
          +PUMPFUN = '6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P'
          +TOKEN_PROGRAM = 'TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA'
          +SOLANA_BASE58 = set('123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz')
          +FIELDS = ['timestamp_utc', 'event', 'mint', 'signature', 'elapsed_seconds', 'amount_usdc', 'proceeds_usdc', 'net_pnl_usdc', 'reason']
          +
          +
          +def D(x):
          +    result = Decimal(str(x))
          +    if not result.is_finite():
          +        raise ValueError('non-finite decimal')
          +    return result
          +
          +
          +def is_pubkey(mint):
          +    return isinstance(mint, str) and 32 <= len(mint) <= 44 and all(c in SOLANA_BASE58 for c in mint)
          +
          +
          +def is_signature(signature):
          +    return isinstance(signature, str) and 80 <= len(signature) <= 90 and all(c in SOLANA_BASE58 for c in signature)
          +
          +
          +def create_event_signature(payload):
          +    """Only verified successful Pump.fun launch instructions create candidates."""
          +    if not isinstance(payload, dict) or payload.get('method') != 'logsNotification':
          +        return None
          +    value = (payload.get('params') or {}).get('result') or {}
          +    value = value.get('value') or {}
          +    logs = value.get('logs') or []
          +    if value.get('err') is not None or not isinstance(logs, list):
          +        return None
          +    invoked = any(isinstance(s, str) and f'Program {PUMPFUN} invoke' in s for s in logs)
          +    created = any(isinstance(s, str) and re.search(r'Instruction:\s*Create(?:V2)?\b', s, re.I) for s in logs)
          +    signature = value.get('signature')
          +    return signature if invoked and created and is_signature(signature) else None
          +
          +
          +def new_mint_from_transaction(tx):
          +    """Requires exactly one mint initialized in the confirmed transaction."""
          +    if not isinstance(tx, dict) or (tx.get('meta') or {}).get('err') is not None:
          +        return None
          +    inner = (tx.get('meta') or {}).get('innerInstructions') or []
          +    top = ((tx.get('transaction') or {}).get('message') or {}).get('instructions') or []
          +    instructions = list(top)
          +    for group in inner:
          +        instructions.extend(group.get('instructions') or [])
          +    mints = set()
          +    for inst in instructions:
          +        if not isinstance(inst, dict):
          +            continue
          +        parsed = inst.get('parsed') or {}
          +        if isinstance(parsed, dict) and parsed.get('type') in ('initializeMint', 'initializeMint2'):
          +            mint = (parsed.get('info') or {}).get('mint')
          +            if is_pubkey(mint):
          +                mints.add(mint)
          +    return next(iter(mints)) if len(mints) == 1 else None
          +
          +
          +class ProviderFailure(Exception):
          +    pass
          +
          +
          +class Remote:
          +    def __init__(self, helius_key, jupiter_key, transport=None):
          +        self.helius_key = helius_key
          +        self.jupiter_key = jupiter_key
          +        self.transport = transport or self._http_json
          +        self.rpc_url = 'https://mainnet.helius-rpc.com/?' + urlencode({'api-key': helius_key})
          +        self.last_jupiter_request_at = float('-inf')
          +
          +    @staticmethod
          +    def _http_json(url, method='GET', payload=None, headers=None):
          +        req = Request(url, method=method, data=json.dumps(payload).encode() if payload is not None else None,
          +                      headers={'Accept': 'application/json', 'Content-Type': 'application/json', **(headers or {})})
          +        try:
          +            with urlopen(req, timeout=3) as resp:
          +                if resp.status != 200:
          +                    raise ProviderFailure('HTTP '+str(resp.status))
          +                raw = resp.read(750001)
          +                if len(raw) > 750000:
          +                    raise ProviderFailure('response_too_large')
          +                return json.loads(raw)
          +        except HTTPError as e:
          +            raise ProviderFailure('HTTP '+str(e.code)) from e
          +        except (URLError, TimeoutError, OSError) as e:
          +            raise ProviderFailure('network_'+type(e).__name__) from e
          +        except (UnicodeDecodeError, ValueError) as e:
          +            raise ProviderFailure('invalid_json') from e
          +
          +    def rpc(self, method, params):
          +        response = self.transport(self.rpc_url, method='POST', payload={
          +            'jsonrpc': '2.0', 'id': 1, 'method': method, 'params': params})
          +        if not isinstance(response, dict):
          +            raise ProviderFailure('RPC malformed_response')
          +        if response.get('error'):
          +            error = response['error']
          +            code = error.get('code', 'unknown') if isinstance(error, dict) else 'unknown'
          +            raise ProviderFailure('RPC '+method+' error_'+str(code))
          +        return response.get('result')
          +
          +    def confirmed_new_mint(self, signature):
          +        # A freshly confirmed signature sometimes takes a moment to become queryable.
          +        for attempt in range(3):
          +            tx = self.rpc('getTransaction', [signature, {
          +                'encoding': 'jsonParsed', 'commitment': 'confirmed',
          +                'maxSupportedTransactionVersion': 0}])
          +            if tx is not None:
          +                launched_at=tx.get('blockTime') if isinstance(tx, dict) else None
          +                if isinstance(launched_at,int) and time.time()-launched_at>12:
          +                    return None  # Late replay, never pretend it was first-second.
          +                return new_mint_from_transaction(tx)
          +            if attempt < 2:
          +                time.sleep(.2)
          +        return None
          +
          +    def mint_safe(self, mint):
          +        """Conservative base-token check; unknown authorities fail CLOSED."""
          +        acc = self.rpc('getAccountInfo', [mint, {'encoding': 'jsonParsed', 'commitment': 'confirmed'}])
          +        val = (acc or {}).get('value') or {}
          +        info = (((val.get('data') or {}).get('parsed') or {}).get('info') or {})
          +        if val.get('owner') != TOKEN_PROGRAM:
          +            raise ProviderFailure('unsupported_token_program')
          +        if info.get('mintAuthority') is not None or info.get('freezeAuthority') is not None:
          +            raise ProviderFailure('active_mint_or_freeze_authority')
          +        if not isinstance(info.get('decimals'), int) or not 0 <= info['decimals'] <= 12:
          +            raise ProviderFailure('unverified_mint_decimals')
          +        return info['decimals']
          +
          +    def quote(self, input_mint, output_mint, amount):
          +        # Free API keys are often rate limited. Do not use 2m scanner's slow
          +        # backoff path; pause only when needed and record true order latency.
          +        delay = max(0, self.last_jupiter_request_at + 1.1 - time.monotonic())
          +        if delay:
          +            time.sleep(delay)
          +        self.last_jupiter_request_at = time.monotonic()
          +        url = 'https://api.jup.ag/swap/v2/order?' + urlencode({
          +            'inputMint': input_mint, 'outputMint': output_mint, 'amount': str(amount)})
          +        res = self.transport(url, headers={'x-api-key': self.jupiter_key})
          +        if not isinstance(res, dict) or res.get('errorCode'):
          +            raise ProviderFailure('Jupiter_no_valid_quote')
          +        try:
          +            out = int(res['outAmount'])
          +            fee = int(res.get('feeBps') or 0)
          +            inp = int(res.get('inAmount', amount))
          +        except (ValueError, TypeError, KeyError) as e:
          +            raise ProviderFailure('Jupiter_malformed_quote') from e
          +        if inp != amount or out <= 0 or not 0 <= fee <= 300:
          +            raise ProviderFailure('Jupiter_bad_amount_or_fee')
          +        return out
          +
          +
