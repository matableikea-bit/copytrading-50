          +# CopyTrading 50 V15 — Sniper intégré (PAPER ONLY)
          +
          +Ce n'est **pas** un second bot ou un deuxième portefeuille. Le moteur de V14.7.3 garde SCANNER / COPIER / BRAIN / EXECUTOR / RISK / BANKER ; le **SNIPER** écoute en parallèle les créations Pump.fun par Helius WebSocket et dépose les positions et transactions dans **la même base SQLite et le même état `portfolio`**. Le dashboard contient un panneau Sniper et l'historique global contient les transactions source=SNIPER. Les étapes GitHub conservent les mêmes positions et le même solde.
          +
          +Réglage : âge minimum **0 secondes pour SNIPER seulement** (les seuils du SCANNER classique restent inchangés). Entrée: nouvelle création Pump.fun validée puis contrôle du token + deux cotations Jupiter + contrôle de coût, délais, risque global. Plafond **10% du capital de départ par entrée**, et plafonds globaux inchangés. Sortie tentée 15 secondes après entrée. Aucune vente n'est inventée lorsque les cotations échouent ; le moteur réessaie et conserve la position ouverte dans le rapport.
          +
          +**Limitations critiques** : l'écoute WebSocket est rapide, mais les requêtes réseau, la confirmation de bloc et l'obtention d'une route Jupiter ne permettent pas de garantir une entrée en 1 seconde. De nouveaux tokens Pump.fun peuvent ne pas être routables sur Jupiter pendant la phase de bonding curve : ils sont **rejetés** plutôt que d'acheter sans devis. Les cotations PAPER ne sont pas de vrais fills et ne permettent pas de conclure qu'une stratégie de 15 secondes gagnerait de l'argent. Le système ne fournit aucun code de trading réel, aucune clé privée et aucun dépôt.
          +
          +Installer `.github/workflows/copytrading-v15-unifie-paper.yml` en conservant `.github/workflows/copytrading-v147-complet.yml` comme source historique. Tester d'abord `2min / 100 / offensif`, puis examiner `checkpoint-v15-unified-stage-1` et l'interface `docs/resultats.html`. La simulation V14.7.3 déjà en cours n'est pas modifiée.
          __SNIPER_UNIFIED_PATCH__
          patch -p1 --fuzz=0 < /tmp/v15unified.patch
          python -c 'from bot.sniper_agent import IntegratedBot; assert IntegratedBot'
