              if age<cfg.min_pool_age_seconds or age>cfg.max_pool_age_seconds:bad.append('pool_age_rejected')
              if m.liquidity_usd<D(cfg.min_liquidity_usd):bad.append('low_liquidity')
              if m.volume_5m_usd<D(cfg.min_volume_5m_usd):bad.append('low_volume')
              if m.market_cap_usd>D(cfg.max_fdv_usd):bad.append('fdv_too_large')
              if abs(m.price_change_5m)>D(cfg.max_5m_price_jump_percent):bad.append('price_jump')
