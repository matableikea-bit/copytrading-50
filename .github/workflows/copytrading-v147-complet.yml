          cat > 'tests/test_github_workflow.py' <<'__COPYTRADING_147_SOURCE_033__'
          """Check staged GitHub Actions simulation without any network access."""
          import json
          import os
          from pathlib import Path
          import tempfile
          import unittest
          from unittest.mock import patch
          
          from bot.gh_session import (SESSION_SECONDS, segment_seconds, prepare_config,
                                      run_stage, write_performance, append_summary)
          from bot.settings import Config
          
          
          class FakePaperBot:
              """Purely deterministic substitute for provider-heavy market ticks."""
              def __init__(self, cfg, store):
                  self.cfg = cfg
                  self.store = store
                  self.state = store.initialize(cfg, 1730000000)
          
              def tick(self):
                  self.state['fake_tick_count'] = self.state.get('fake_tick_count', 0) + 1
                  # A simulated position is never conjured to manufacture gains.
                  self.store.put('portfolio', self.state)
                  report = self.store.report(self.state, {}, 1730000000, liquidations={})
                  report['session_buy_entries'] = 0
                  return report
          
          
          class GitHubSimulationTests(unittest.TestCase):
              def test_three_job_partition(self):
                  self.assertEqual(segment_seconds('10h', 1), 200 * 60)
                  self.assertEqual(segment_seconds('10h', 3), 200 * 60)
                  self.assertEqual(segment_seconds('12h', 2), 240 * 60)
                  self.assertEqual(segment_seconds('2min', 1), 120)
                  for name, stage in [('2min', 2), ('10h', 0), ('12h', 4), ('other', 1)]:
                      with self.subTest(name=name, stage=stage), self.assertRaises(ValueError):
                          segment_seconds(name, stage)
          
              def test_paper_only_rejects_live_and_flags(self):
                  with tempfile.TemporaryDirectory() as d:
                      config_path = Path(d) / 'config.json'
                      config_path.write_text(json.dumps({'mode': 'LIVE', 'live_mint_allowlist': [
                          'So11111111111111111111111111111111111111112']}))
                      with self.assertRaisesRegex(ValueError, 'PAPER'):
                          prepare_config(str(config_path))
                      config_path.write_text(json.dumps({'mode': 'PAPER'}))
                      with patch.dict(os.environ, {'ENABLE_LIVE_TRADING': 'yes'}):
                          with self.assertRaisesRegex(ValueError, 'LIVE flags'):
                              prepare_config(str(config_path))
                      with self.assertRaises(ValueError):
                          prepare_config(str(config_path), '{"wrong":"shape"}')
          
              def test_checkpoint_resumes_without_resetting_portfolio(self):
                  with tempfile.TemporaryDirectory() as d:
                      db = str(Path(d) / 'session.sqlite')
                      report = str(Path(d) / 'status.json')
                      cfg = Config()
                      cfg.session_hours = 10
                      for stage in (1, 2, 3):
                          got = run_stage(cfg, session='10h', stage=stage,
                                          db_path=db, report_path=report, run_id='test-run',
                                          bot_factory=FakePaperBot, max_ticks=1)
                          self.assertEqual(got['mode'], 'PAPER')
                          self.assertTrue(Path(db).is_file())
                      from bot.store import Store
                      store = Store(db)
                      try:
                          self.assertEqual(store.get('portfolio')['fake_tick_count'], 3)
                          self.assertEqual(store.get('github_session_meta')['last_stage'], 3)
                          self.assertEqual(store.get('github_session_meta')['run_id'], 'test-run')
                      finally:
                          store.close()
                      out = str(Path(d) / 'perf.json')
                      csv = str(Path(d) / 'trades.csv')
                      write_performance(db, out, csv)
                      self.assertEqual(json.loads(Path(out).read_text())['buy_executions'], 0)
                      self.assertIn('side', Path(csv).read_text())
                      with self.assertRaisesRegex(ValueError, 'existing database'):
                          run_stage(cfg, session='10h', stage=1, db_path=db, report_path=report,
                                    run_id='test-run', bot_factory=FakePaperBot, max_ticks=1)
          
              def test_reject_missing_and_cross_run_checkpoints(self):
                  with tempfile.TemporaryDirectory() as d:
                      db = str(Path(d) / 's.sqlite')
                      report = str(Path(d) / 'report.json')
