          def run_stage(cfg: Config, *, session: str, stage: int, db_path: str,
                        report_path: str, run_id: str = '', max_ticks: int = 0,
                        monotonic=time.monotonic, wall_clock=time.time, sleep=time.sleep,
                        bot_factory=Bot) -> dict:
              """Run one time-bounded stage. A new stage always resumes the same portfolio.
          
              `max_ticks` is for deterministic local tests; not used by GitHub runs.
              """
              seconds = segment_seconds(session, stage)
              db_file = Path(db_path)
              if stage == 1 and db_file.exists():
                  raise ValueError('stage 1 refuses an existing database; start a fresh run')
              if stage > 1 and not db_file.exists():
                  raise ValueError('missing checkpoint from previous GitHub Actions job')
          
              config_signature = hashlib.sha256(json.dumps(asdict(cfg), sort_keys=True).encode()).hexdigest()
              report = None
              with singleton(str(db_file) + '.lock'):
                  store = Store(str(db_file))
                  try:
                      meta = store.get('github_session_meta')
                      if stage == 1:
                          if meta is not None:
                              raise ValueError('session already initialized')
                          meta = {'session': session, 'run_id': str(run_id), 'last_stage': 0,
                                  'config_signature': config_signature}
                          store.put('github_session_meta', meta)
                      else:
                          if not isinstance(meta, dict) or meta.get('session') != session:
                              raise ValueError('checkpoint session does not match selected duration')
                          if meta.get('run_id') != str(run_id):
                              raise ValueError('checkpoint belongs to another GitHub Actions run')
                          if meta.get('config_signature') != config_signature:
                              raise ValueError('configuration changed between GitHub stages')
                          if meta.get('last_stage') != stage - 1:
                              raise ValueError('checkpoint stage order is invalid')
                      bot = bot_factory(cfg, store)
                      if stage == 1 and session == '2min':
                          bot.state['expires_at'] = int(wall_clock()) + SESSION_SECONDS['2min']
                          store.put('portfolio', bot.state)
          
                      deadline = monotonic() + seconds
                      # Last stage gets a brief chance to close PAPER positions once the
                      # session has expired. Unquotable positions remain clearly open.
                      last_stage = stage == (1 if session == '2min' else 3)
                      if last_stage:
                          deadline += 180
                      count = 0
                      while True:
                          try:
                              report = bot.tick()
                              report['strategy_profile'] = cfg.strategy_profile
                              write_report(report, report_path)
                              print(json.dumps({
                                  'stage': stage, 'session': session,
                                  'time': report.get('timestamp_utc'),
                                  'equity_usdc': report.get('equity_estimate_usdc'),
                                  'pnl_usdc': report.get('pnl_estimate_usdc'),
                                  'positions': len(report.get('positions', [])),
                                  'buys': report.get('session_buy_entries', 0),
                                  'halted': report.get('halted', False),
                                  'reason': report.get('halt_reason', ''),
                              }), flush=True)
                          except Exception:
                              # Never continue submitting decisions after an unknown fault;
                              # checkpoint state is preserved for inspection.
                              bot.state['halted'] = True
                              bot.state['halt_reason'] = 'github_stage_unhandled_error'
                              store.put('portfolio', bot.state)
                              raise
                          count += 1
                          if max_ticks and count >= max_ticks:
                              break
                          if last_stage and bot.state.get('halt_reason') == 'session_complete' and not bot.state['positions']:
                              break
                          remaining = deadline - monotonic()
                          if remaining <= 0:
                              break
                          sleep(min(cfg.poll_seconds, remaining))
                      store.put('github_session_meta', {**meta, 'last_stage': stage})
                      store.db.execute('PRAGMA wal_checkpoint(TRUNCATE)')
                  finally:
                      store.close()
              if report is None:
                  raise RuntimeError('simulation stage produced no report')
              return report
          
          
          def main(argv=None):
              parser = argparse.ArgumentParser(description='GitHub Actions staged PAPER simulation')
              parser.add_argument('--stage', type=int, required=True)
              parser.add_argument('--session', choices=SESSION_SECONDS, required=True)
              parser.add_argument('--config', default='config.json')
              parser.add_argument('--db', default='runtime/github-session.sqlite')
              parser.add_argument('--report', default='docs/status.json')
              parser.add_argument('--performance', default='docs/performance.json')
              parser.add_argument('--trades', default='docs/trades.csv')
              parser.add_argument('--max-ticks', type=int, default=0,
                                  help='local tests only; not set by GitHub Actions')
              args = parser.parse_args(argv)
              cfg = prepare_config(args.config, os.getenv('SIM_WALLETS_JSON'))
              if args.session == '2min':
                  cfg.session_hours = 1  # Bot will use the persisted 2-minute expiry
              else:
