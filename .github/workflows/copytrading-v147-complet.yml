                  fh.write(data)
          
          
          def write_performance(db: str, performance_path: str, trades_path: str) -> None:
              """Generate audited results and trade CSV from the last SQLite checkpoint."""
              store = Store(db)
              try:
                  state = store.get('portfolio')
                  if state is None:
                      raise ValueError('missing saved portfolio')
                  summary = summarize(state, store.stats())
                  output = Path(performance_path)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  tmp = output.with_suffix(output.suffix + '.tmp')
                  tmp.write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding='utf-8')
                  tmp.replace(output)
                  path = Path(trades_path)
                  path.parent.mkdir(parents=True, exist_ok=True)
