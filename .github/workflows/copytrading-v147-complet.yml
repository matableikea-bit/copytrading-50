                          'source_wallet', 'qty', 'spent_usdc', 'proceeds_usdc',
                          'realized_pnl_usdc', 'reason', 'chain_tx_signature', 'mode']
                  with path.open('w', encoding='utf-8', newline='') as fd:
                      writer = csv.DictWriter(fd, fieldnames=keys, extrasaction='ignore')
                      writer.writeheader()
