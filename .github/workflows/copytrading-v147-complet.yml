              """Stops use Jupiter executable liquidation values when supplied by the runner.
          
              `net_exit_value` is an *estimate*: execution can slip or fail. A missing
              value never turns into an invented mid-price exit in autonomous mode.
              """
              if net_exit_value is not None:
                  value=D(net_exit_value)
                  cost=D(position['cost_usdc'])
                  high=max(value,D(position.get('peak_exit_value_usdc',cost)))
                  if cost<=0:return 'corrupt_entry'
                  if value<=cost*(1-D(cfg.stop_loss_fraction)):return 'stop_loss'
                  if value>=cost*(1+D(cfg.take_profit_fraction)):return 'take_profit'
                  if high>=cost*(1+D(cfg.trailing_activation_fraction)) and value<=high*(1-D(cfg.trailing_gap_fraction)):
                      return 'trailing_stop'
              else:
                  # Legacy policy for direct independent use; production runner supplies
                  # net Jupiter quotes and skips price stops when they are unavailable.
                  price=m.price_usd
                  entry=D(position['entry_price_usd'])
                  peak=max(price,D(position['peak_price_usd']))
                  if entry<=0:return 'corrupt_entry'
                  if price<=entry*(1-D(cfg.stop_loss_fraction)):return 'stop_loss'
                  if price>=entry*(1+D(cfg.take_profit_fraction)):return 'take_profit'
                  if peak>=entry*(1+D(cfg.trailing_activation_fraction)) and price<=peak*(1-D(cfg.trailing_gap_fraction)):
                      return 'trailing_stop'
              if now-int(position['opened_at'])>=cfg.max_hold_minutes*60:return 'time_stop'
