          """Run a reproducible PAPER simulation in separate GitHub Actions jobs.
          
          GitHub-hosted jobs have a 6 hour limit. A 10h/12h session is split
          into three jobs with an SQLite checkpoint passed as an artifact.
          Never sends real orders: refuses LIVE configuration and trading flags.
          """
          from __future__ import annotations
          
          import argparse
          import hashlib
          from dataclasses import asdict
          import csv
          import json
          import os
          from pathlib import Path
          import signal
          import sys
          import time
          from datetime import datetime, timezone
          
          from .performance import summarize
          from .runner import Bot, singleton, write_report
          from .settings import Config
          from .profiles import apply_profile
          from .store import Store
          
          
          SESSION_SECONDS = {'2min': 120, '10h': 10 * 3600, '12h': 12 * 3600}
          
          
          def segment_seconds(session: str, stage: int) -> int:
              """Return the stage's execution budget, excluding a closing grace period."""
              if session not in SESSION_SECONDS:
                  raise ValueError('session must be 2min, 10h or 12h')
              if not 1 <= stage <= (1 if session == '2min' else 3):
                  raise ValueError('invalid stage for session')
              return SESSION_SECONDS[session] if session == '2min' else SESSION_SECONDS[session] // 3
          
          
          def prepare_config(path: str, wallet_env: str | None = None) -> Config:
              """Use public-only, PAPER-only settings. Wallets are an optional JSON list."""
              cfg = Config.load(path)
              if cfg.mode != 'PAPER':
                  raise ValueError('GitHub simulation only accepts mode=PAPER')
              if os.getenv('ENABLE_LIVE_TRADING') or os.getenv('LIVE_TRADING_CONFIRMATION'):
                  raise ValueError('Remove all LIVE flags from the simulation job')
              if wallet_env and wallet_env.strip():
                  wallets = json.loads(wallet_env)
                  if not isinstance(wallets, list):
                      raise ValueError('SIM_WALLETS_JSON must be a JSON list of Solana wallet addresses')
                  cfg.trader_wallets = wallets
                  cfg.validate()
              return apply_profile(cfg, os.getenv('PAPER_PROFILE', 'standard'),
                                   os.getenv('PAPER_CAPITAL', str(cfg.starting_usdc)))
          
          
          def append_summary(report: dict, stage: int, session: str, path: str | None = None) -> None:
              """Write a simple GitHub Actions summary without printing private secrets."""
              out = path or os.getenv('GITHUB_STEP_SUMMARY')
              if not out:
                  return
              equity = report.get('equity_estimate_usdc')
              equity_text = str(equity) if equity is not None else 'indisponible (cotation manquante)'
              pnl = report.get('pnl_estimate_usdc')
              pnl_text = str(pnl) if pnl is not None else 'indisponible'
              data = (
                  f'### CopyTrading 50 — simulation {session}, étape {stage}\n\n'
                  f'- Mode : **PAPER uniquement**\n'
                  f'- Capital initial : **{report.get("starting_balance_usdc")} USDC**\n'
                  f'- Profil : **{report.get("strategy_profile", "standard")}**\n'
                  f'- Équité estimée : **{equity_text} USDC**\n'
                  f'- P&L estimé : **{pnl_text} USDC**\n'
                  f'- Positions ouvertes : **{len(report.get("positions", []))}**\n'
                  f'- Achats : **{report.get("session_buy_entries", 0)}**\n'
                  f'- BRAIN actif : **{report.get("brain_enabled", False)}**\n'
                  f'- Wallets suivis : **{report.get("watching_wallets", 0)}**\n'
                  f'- Wallets sains : **{sum(bool(x.get("healthy")) for x in report.get("wallet_feed_health", {}).values())}**\n'
                  f'- Source Helius : **{report.get("wallet_provider_diagnostics",{}).get("transport","non renseignée")}**\n'
                  f'- Arrêt du moteur : **{report.get("halted", False)}**\n\n'
                  'Ces résultats sont simulés : aucune rentabilité n’est garantie. '
                  'Consulter les artifacts pour la base et les rapports.\n\n'
              )
