                  if any(mint not in liquidations for mint in pos):return D(0),'unknown_liquidation_value'
                  if any(mint not in marks for mint in pos):return D(0),'unknown_market_value'
                  liquid_equity=sum((D(liquidations[mint]) for mint in pos),D(0))
                  # Exposure limits use the larger of indicative mark and liquidation
                  # value to avoid undercounting an illiquid or wide-spread holding.
                  exposure=sum((max(D(p['qty'])*marks[mint].price_usd,D(liquidations[mint]))
                                for mint,p in pos.items()),D(0))
              else:
                  # Kept for deterministic standalone risk tests; runner passes Jupiter valuations.
                  if any(mint not in marks for mint in pos):return D(0),'unknown_market_value'
                  exposure=sum((D(p['qty'])*marks[mint].price_usd for mint,p in pos.items()),D(0))
              if len(pos)>=cfg.max_open_positions:return D(0),'too_many_positions'
              if sum(t.get('side')=='BUY' for t in state['trades'])>=cfg.max_trades_per_session:return D(0),'session_entry_limit'
              equity=cash+(liquid_equity if liquidations is not None else exposure)
              peak=max(D(state['peak_equity_usdc']),equity)
              if equity<peak*(1-D(cfg.max_drawdown_fraction)):return D(0),'max_drawdown'
              if equity<D(state['day_start_equity_usdc'])*(1-D(cfg.max_daily_loss_fraction)):
                  return D(0),'daily_loss_limit'
              budget=min(equity*D(cfg.max_trade_fraction),
