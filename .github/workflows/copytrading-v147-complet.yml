          :root{color-scheme:dark;--bg:#0b0e14;--card:#151a24;--panel:#11151e;--edge:#263041;--fg:#eff3fb;--mut:#91a0b6;--green:#49e4b0;--red:#ff7185;--gold:#ffca7a;--violet:#b9a1ff}
          *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% -15%,#22264a 0,transparent 36%),var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}main{max-width:1180px;margin:auto;padding:26px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid var(--edge);padding-bottom:22px}.logo{font-size:23px;font-weight:850;letter-spacing:-.8px}.logo span{color:var(--green)}.sub{margin:5px 0;color:var(--mut);font-size:12px;letter-spacing:1.2px;text-transform:uppercase}.tag{padding:8px 12px;border:1px solid #3f765f;border-radius:999px;background:#18332c;color:#96ffd4;font-size:12px;font-weight:750}.tag.live{border-color:#c0814b;background:#3a281d;color:#ffca7a}.tag.stop{border-color:#b35663;background:#392127;color:#ffadb8}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.hero{margin-top:24px}.card{background:linear-gradient(165deg,#171e29,#121721);border:1px solid var(--edge);border-radius:18px;padding:20px}.capital{grid-column:span 7}.health{grid-column:span 5}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--mut);font-weight:750}.big{font-size:clamp(42px,6vw,70px);font-weight:840;letter-spacing:-2.5px;font-variant-numeric:tabular-nums;margin:10px 0}.pct{font-size:17px;font-weight:720}.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:var(--mut)}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:34px 0 14px}.section h2{font-size:18px;margin:0;letter-spacing:-.4px}.pill{font-size:11px;padding:6px 10px;border-radius:99px;color:var(--mut);background:#242c39}.agents{grid-column:span 12;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}.agent{border:1px solid var(--edge);background:#141a25;padding:17px 14px;border-radius:15px;min-height:127px}.agent .ico{font-size:24px}.agent strong{font-size:13px;display:block;margin-top:9px}.agent small{display:block;font-size:11px;color:var(--mut);margin-top:5px;line-height:1.45}.stat{grid-column:span 3}.stat .number{font-weight:800;font-size:28px;margin:12px 0 0;letter-spacing:-.8px}.table-card{grid-column:span 8;overflow:auto}.side-card{grid-column:span 4}.card h3{font-size:15px;margin:0 0 15px}.muted{color:var(--mut);font-size:12px}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);padding:12px 9px;border-bottom:1px solid var(--edge)}td{padding:12px 9px;border-bottom:1px solid #252c39}tr:last-child td{border:0}.numeric{text-align:right;font-variant-numeric:tabular-nums}.score{background:#2a3f42;color:#b4ffe3;padding:4px 8px;border-radius:8px;font-weight:750}.name{font-weight:700}.token{font-size:10px;color:var(--mut);max-width:125px;overflow:hidden;text-overflow:ellipsis}.event{display:flex;gap:10px;border-bottom:1px solid #222b36;padding:13px 0;font-size:12px}.event:last-child{border:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--violet);flex:none;margin-top:4px}.event small{color:var(--mut);display:block;margin-top:4px}.healthline{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--edge);font-size:13px}.healthline:last-child{border:0}.status{font-size:11px;font-weight:750;color:var(--green)}.note{margin-top:21px;border-left:3px solid var(--gold);padding:10px 17px;color:#d1c4a2;font-size:12px;line-height:1.65;background:#292418;border-radius:0 9px 9px 0}#spark{width:100%;height:120px;display:block;margin-top:20px}.empty{color:var(--mut);font-size:13px;padding:16px 0}footer{color:#68778d;font-size:12px;line-height:1.7;margin-top:30px}a{color:var(--green)}.div{border-top:1px solid var(--edge);margin-top:10px;padding-top:18px}.error{background:#351d25;border:1px solid #8a3b4f;border-radius:10px;padding:13px;margin-top:20px;font-size:12px;display:none}@media(max-width:820px){.capital,.health,.table-card,.side-card{grid-column:span 12}.stat{grid-column:span 6}.agents{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:490px){.agents{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{grid-column:span 6}.capital .big{font-size:49px}.card{padding:15px}header .logo{font-size:19px}}
          </style>
          </head>
          <body><main>
          <header><div><div class="logo">COPY<span>TRADING</span> 50 <span style="font-size:11px;color:#91a0b6">V14.4</span></div><p class="sub">Solana · On-chain intelligence · 10h / 12h GitHub PAPER sessions</p></div><div id="mode" class="tag">CHARGEMENT</div></header>
          <div id="error" class="error"></div>
          <div class="grid hero">
          <section class="card capital"><div class="eyebrow">Équité estimée (USDC)</div><div class="big" id="equity">—</div><div class="pct" id="pnl">En attente de données vérifiées</div><svg id="spark" viewBox="0 0 690 120" preserveAspectRatio="none" aria-label="Historique des valorisations estimées"><text x="20" y="64" fill="#8493ab" font-size="15">L'historique apparaîtra pendant l'exécution.</text></svg><div class="muted" id="asof">Aucune cotation</div></section>
          <section class="card health"><div class="eyebrow">État du moteur</div><div class="healthline"><span>SCOUT — nouvelles fiches Solana</span><span id="scouthealth" class="status">—</span></div><div class="healthline"><span>BRAIN — évaluation</span><span id="brainhealth" class="status">—</span></div><div class="healthline"><span>COPIER — wallets suivis</span><span id="wallets" class="status">—</span></div><div class="healthline"><span>RISK — frein d'urgence</span><span id="halt" class="status">—</span></div><div class="healthline"><span>Exécution</span><span id="execution" class="status">—</span></div><div class="note">Les profits ne sont pas garantis. Les prix DexScreener sont indicatifs; le slippage, les gas fees et la liquidité peuvent empêcher une sortie au prix affiché.</div></section>
          </div>
          <div class="section"><h2>Les 7 rôles du pipeline</h2><span class="pill">Fonctions du code, pas IA autonome</span></div>
          <div class="agents">
          <div class="agent"><span class="ico">🔎</span><strong>SCANNER / SCOUT</strong><small>Découvre les tokens, observe le momentum sur plusieurs relevés.</small></div>
          <div class="agent"><span class="ico">🧠</span><strong>ANALYST</strong><small>Évalue liquidité, activité, ancienneté et sécurité de base des mints.</small></div>
          <div class="agent"><span class="ico">🔁</span><strong>COPIER</strong><small>Suit seulement les wallets configurés et les swaps identifiables.</small></div>
          <div class="agent"><span class="ico">🧠</span><strong>BRAIN</strong><small>Compare les observations 1m / 5m / 15m et dimensionne les entrées sous le plafond RISK.</small></div><div class="agent"><span class="ico">⚡</span><strong>EXECUTOR / SNIPER</strong><small>Vérifie les devis Jupiter et leurs coûts; ne simule un achat que si les contrôles passent.</small></div>
          <div class="agent"><span class="ico">🛡️</span><strong>RISK</strong><small>Limite chaque achat, exposition, durée et pertes.</small></div>
          <div class="agent"><span class="ico">🏦</span><strong>BANKER</strong><small>Vend aux stops, prises de bénéfices partielles, trailing et fin de session.</small></div>
          </div>
          <div class="section"><h2>Comptabilité</h2><span class="pill">Pas de rendements simulés affichés comme réels</span></div>
