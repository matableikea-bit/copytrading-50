          def risk_budget(state:dict,cfg:Config,marks:dict[str,Market],liquidations=None) -> tuple[Decimal,str]:
              if state['halted']:return D(0),'circuit_breaker'
              pos=state['positions'];cash=D(state['cash_usdc'])
              if liquidations is not None:
