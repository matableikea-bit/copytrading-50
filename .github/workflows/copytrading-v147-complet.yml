          </div>
          <div class="section"><h2>Traders suivis — résultats observés</h2><span class="pill">Adresses configurées, jamais des profils fictifs</span></div>
          <section class="card" style="overflow:auto"><table><thead><tr><th>Wallet Solana</th><th class="numeric">Swaps vus</th><th class="numeric">Allers-retours</th><th class="numeric">Ventes rapides</th><th>Filtre</th></tr></thead><tbody id="traderstats"><tr><td colspan="5" class="empty">Aucun wallet configuré. Ajouter une adresse vérifiée et une clé Helius locale pour activer COPIER.</td></tr></tbody></table></section>
          <div class="section"><h2>Ordres et positions</h2><span class="pill">Traçabilité</span></div>
          <div class="grid"><section class="card table-card"><h3>Opérations</h3><table><thead><tr><th>Heure UTC</th><th>Action</th><th>Token</th><th>Capital / P&L</th></tr></thead><tbody id="trades"><tr><td colspan="4" class="empty">Aucune opération</td></tr></tbody></table></section>
          <section class="card side-card"><h3>Positions ouvertes</h3><div id="open"><div class="empty">Aucune position</div></div><div class="div muted" id="winrate">Win rate : non calculable sans trades clôturés.</div></section></div>
          <footer>Tableau de bord local : lecture de <code>status.json</code> toutes les 10 secondes. Une valorisation estimée n'est pas une promesse de gain ni une preuve de prix d'exécution. Le bot tourne seulement tant que le processus Python reste actif. Aucun ordre n'est envoyé par cette page.</footer>
          </main>
          <script>
          'use strict';
          const $=id=>document.getElementById(id);
          const fmt=(n,d=2)=>{const v=Number(n);return Number.isFinite(v)?v.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—'};
          const text=(id,v)=>{$(id).textContent=String(v??'—')};
          function node(tag,txt,cl){const el=document.createElement(tag);el.textContent=String(txt??'');if(cl)el.className=cl;return el}
          function renderList(id,items,fn,empty){const container=$(id);container.replaceChildren();if(!items.length){container.append(node('div',empty,'empty'));return}for(const item of items)container.append(fn(item))}
          function draw(series){const el=$('spark');el.replaceChildren();const vals=series.map(x=>Number(x.value)).filter(Number.isFinite);if(vals.length<2)return;let min=Math.min(...vals),max=Math.max(...vals);if(max===min){max+=1;min-=1}const points=vals.map((v,i)=>`${10+i*670/(vals.length-1)},${110-100*(v-min)/(max-min)}`).join(' ');const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('fill','none');line.setAttribute('stroke','#49e4b0');line.setAttribute('stroke-width','3');line.setAttribute('stroke-linejoin','round');line.setAttribute('points',points);el.append(line)}
          function update(r){$('error').style.display='none';text('mode',r.mode==='LIVE'?'⚠ LIVE — ARGENT RÉEL':'● PAPER — SIMULATION');$('mode').className='tag '+(r.mode==='LIVE'?'live':'');if(r.halted){$('mode').className='tag stop';text('mode','ARRÊT — '+r.halt_reason)}
          text('equity',r.equity_estimate_usdc===null?'INDISPONIBLE':fmt(r.equity_estimate_usdc)+' USDC');const p=Number(r.pnl_estimate_usdc);const pnl=$('pnl');pnl.textContent=r.pnl_estimate_usdc===null?'Cotation insuffisante':(p>=0?'+':'')+fmt(p,4)+' USDC · non garanti';pnl.className='pct '+(p>0?'positive':p<0?'negative':'neutral');
          text('asof','Dernier état : '+(r.timestamp_utc||'—')+' · valorisation indicative');
          text('scouthealth',`${(r.scout_candidates||[]).length} candidats affichés`);text('brainhealth',r.brain_enabled?`${(r.brain_latest_assessments||[]).length} évaluations / cycle`:'désactivé');const wh=r.wallet_feed_health||{};const ok=Object.values(wh).filter(x=>x.healthy).length;const provider=r.wallet_provider_diagnostics?.transport||'inconnu';text('wallets',`${ok}/${r.watching_wallets??0} actifs · ${provider}`);text('halt',r.halted?r.halt_reason:'Actif');$('halt').style.color=r.halted?'#ff7185':'#49e4b0';text('execution',r.mode==='PAPER'?'PAPER · Jupiter cotations':'LIVE · Jupiter exécution');
          text('capital',fmt(r.starting_balance_usdc)+' USDC');text('cash',fmt(r.cash_usdc)+' USDC');text('positions',(r.positions||[]).length);text('closed',r.closed_positions??0);text('winrate','Taux de réussite sur positions clôturées : '+(r.win_rate_percent===null?'indisponible':fmt(r.win_rate_percent,1)+' %')+'. Résultat réalisé : '+fmt(r.realized_pnl_usdc,4)+' USDC.');draw(r.equity_history||[]);
          renderList('tokens',r.scout_candidates||[],x=>{let tr=document.createElement('tr');let cells=[x.symbol,x.score,x.brain?.brain_score??'—',fmt(x.liquidity_usd,0),fmt(x.volume_5m_usd,0),(Number(x.change_5m_pct)>0?'+':'')+fmt(x.change_5m_pct,1)+'%'];cells.forEach((v,i)=>{let td=node('td',v,i>1?'numeric':i===0?'name':'');if(i===1||i===2)td.className='score';td.title=i===0?x.mint:(x.filters||[]).join(', ');tr.append(td)});return tr},'Aucun token qualifié ou aucune donnée disponible');
          renderList('events',(r.last_events||[]).slice(0,8),x=>{let el=node('div','','event');let dot=node('span','','dot');dot.style.background=x.decision==='ERROR'?'#ff7185':x.decision==='PAPER_FILL'||x.decision==='FILLED'?'#49e4b0':'#b9a1ff';let t=node('div',`${x.kind} · ${x.decision}`);t.append(node('small',x.reason));el.append(dot,t);return el},'Aucune décision enregistrée');
          renderList('trades',(r.trades||[]).slice().reverse().slice(0,30),x=>{const tr=document.createElement('tr');[x.time?.slice(11,19)??'',x.side,x.symbol??x.mint?.slice(0,8)??'',x.side==='SELL'?fmt(x.realized_pnl_usdc,4)+' USDC':fmt(x.spent_usdc)+' USDC'].forEach((v,i)=>tr.append(node('td',v,i===3?'numeric':'')));return tr},'Aucune opération');
          renderList('traderstats',(r.wallet_fairplay||[]).length?r.wallet_fairplay:Object.entries(r.wallet_feed_health||{}).map(([wallet,feed])=>({wallet,feed})),x=>{let tr=document.createElement('tr');let vals=[(x.wallet||'').slice(0,9)+'…'+(x.wallet||'').slice(-6),x.swaps_observed??0,x.completed_roundtrips_observed??0,x.quick_sells_observed??0,x.feed?(x.feed.healthy?'Flux OK':'ERREUR : '+(x.feed.last_error||'inconnue')):(x.buy_signals_enabled?'Contrôles comportementaux OK':'BLOQUÉ : '+(x.reason||''))];vals.forEach((v,i)=>{let td=node('td',v,i>0&&i<4?'numeric':'');td.title=i===0?x.wallet:(x.reason||'');tr.append(td)});return tr},'Aucun wallet enregistré (la vidéo ne fournit pas de véritables adresses Solana)');
          renderList('open',r.positions||[],x=>{const div=node('div','','healthline');div.append(node('span',x.symbol));div.append(node('span',x.estimated_exit_value_usdc===null?'Sortie non cotable':fmt(x.estimated_exit_value_usdc)+' USDC (sortie Jupiter estimée)','status'));return div},'Aucune position ouverte');}
          async function refresh(){try{const res=await fetch('status.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('Aucun rapport disponible');const report=await res.json();update(report)}catch(e){$('error').style.display='block';$('error').textContent='Données non disponibles. Démarre le bot, puis le serveur local avec python -m http.server 8765 --directory docs. Détail : '+e.message}}
          refresh();setInterval(refresh,10000);
          </script>
