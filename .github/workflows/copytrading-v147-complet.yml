          **PAPER ONLY sur GitHub Actions.** Cette édition reprend la V14.6 complète : SCOUT/SCANNER, ANALYST, BRAIN, COPIER, EXECUTOR/SNIPER, RISK et BANKER. Elle n'affirme ni rendement garanti ni résultat TikTok reproductible.
          
          ## Problèmes observés sur la vraie session V14.4
          
          Le checkpoint `43728186107`, étape 1, montrait **0 achat, 0 vente, 0 USDC de P&L**, 84 événements `wallet_data_failure` avec erreurs HTTP 404, et plusieurs rejets `non-standard token program`.
          
