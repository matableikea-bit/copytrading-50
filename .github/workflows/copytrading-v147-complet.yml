          <div class="grid">
          <section class="card table-card"><h3>SCOUT / ANALYST / BRAIN</h3><table><thead><tr><th>Token</th><th>SCOUT</th><th>BRAIN</th><th class="numeric">Liquidité $</th><th class="numeric">Vol. 5m $</th><th class="numeric">5m %</th></tr></thead><tbody id="tokens"><tr><td colspan="6" class="empty">Aucun relevé</td></tr></tbody></table></section>
