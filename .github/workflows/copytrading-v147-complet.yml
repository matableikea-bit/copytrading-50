                      if 'api.helius.xyz/v0/' in url:raise DataUnavailable('HTTP 404')
                      if kw.get('data',{}).get('method')=='getSignaturesForAddress':
                          return {'result':[{'signature':SIG1,'blockTime':NOW,'err':None}]}
                      self.fail('unexpected RPC')
                  helius=Helius(key='test-key',fetch=fetch)
                  self.assertEqual(helius.latest_signature(WALLET),SIG1)
                  self.assertEqual(helius.transport,'rpc')
                  self.assertEqual(helius.diagnostics['fallbacks'],1)
                  self.assertTrue(any(x[1]=='getSignaturesForAddress' for x in calls))
                  self.assertFalse(any(x[1]=='getTransaction' for x in calls))
                  # RPC path remains selected; never hits old endpoint again.
                  helius.latest_signature(WALLET)
