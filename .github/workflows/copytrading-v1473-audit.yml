    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 265
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      SIM_WALLETS_JSON: ${{ vars.SIM_WALLETS_JSON }}
      PAPER_PROFILE: ${{ inputs.profil }}
      PAPER_CAPITAL: ${{ inputs.capital }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: v1473-sources-lisibles
          path: .
      - name: "Exécuter le bot PAPER avec protections"
        run: python -m bot.gh_session --session "${{ inputs.session }}" --stage 1
      - name: "Générer le tableau de bord hors ligne"
        if: always()
        run: python -m bot.snapshot
      - name: "Enregistrer la base SQLite et les résultats"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v1473-stage-1
          path: |
            runtime/github-session.sqlite
            docs/status.json
            docs/performance.json
            docs/trades.csv
            docs/resultats.html
          retention-days: 7
          if-no-files-found: warn
  stage2:
    name: "Étape 2/3 — Reprendre le portefeuille"
    if: ${{ inputs.session != '2min' }}
    needs: stage1
    runs-on: ubuntu-latest
    timeout-minutes: 265
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      SIM_WALLETS_JSON: ${{ vars.SIM_WALLETS_JSON }}
      PAPER_PROFILE: ${{ inputs.profil }}
      PAPER_CAPITAL: ${{ inputs.capital }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: v1473-sources-lisibles
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-v1473-stage-1
          path: .
      - name: "Exécuter le bot PAPER avec protections"
        run: python -m bot.gh_session --session "${{ inputs.session }}" --stage 2
      - name: "Générer le tableau de bord hors ligne"
        if: always()
        run: python -m bot.snapshot
      - name: "Enregistrer la base SQLite et les résultats"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v1473-stage-2
          path: |
            runtime/github-session.sqlite
            docs/status.json
            docs/performance.json
            docs/trades.csv
            docs/resultats.html
          retention-days: 7
          if-no-files-found: warn
  stage3:
    name: "Étape 3/3 — Bilan final"
    if: ${{ inputs.session != '2min' }}
    needs: stage2
    runs-on: ubuntu-latest
    timeout-minutes: 265
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      SIM_WALLETS_JSON: ${{ vars.SIM_WALLETS_JSON }}
      PAPER_PROFILE: ${{ inputs.profil }}
      PAPER_CAPITAL: ${{ inputs.capital }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: v1473-sources-lisibles
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-v1473-stage-2
          path: .
      - name: "Exécuter le bot PAPER avec protections"
        run: python -m bot.gh_session --session "${{ inputs.session }}" --stage 3
      - name: "Générer le tableau de bord hors ligne"
        if: always()
        run: python -m bot.snapshot
      - name: "Enregistrer la base SQLite et les résultats"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v1473-stage-3-final
          path: |
            runtime/github-session.sqlite
            docs/status.json
            docs/performance.json
            docs/trades.csv
            docs/resultats.html
          retention-days: 14
          if-no-files-found: warn
